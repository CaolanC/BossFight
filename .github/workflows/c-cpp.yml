name: Ubuntu Editor Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Set up Python & Conan
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Conan
      run: |
        pip install conan
        conan profile detect --force
    - name: make conan
      run: make conan
    - name: make cmake
      run: make cmake
    - name: make gui
      run: make gui
